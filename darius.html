<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darius — Le Pouls Numérique Togo</title>
  <meta name="description" content="Délégué médical au Togo. Santé numérique, réalités togolaises & Formations." />
  <style>
    :root { 
      --bg: #0f172a; 
      --card: #1e293b; 
      --text: #e2e8f0; 
      --muted: #94a3b8; 
      --accent: #10b981; /* Vert pour le Togo */
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; }
    .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px; padding: 2rem 1.5rem; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); margin: 2rem 0; }
    
    /* Photo de profil */
    .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 1rem; background: #334155; }
    
    h1 { font-size: 1.6rem; margin-bottom: 0.3rem; color: #fff; }
    .badge { display: inline-block; background: rgba(16, 185, 129, 0.2); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.8rem; letter-spacing: 0.5px; }
    
    .bio { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; line-height: 1.5; padding: 0 0.5rem; }
    
    .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; margin-bottom: 1.5rem; }
    .tag { background: rgba(255, 255, 255, 0.1); color: var(--text); font-size: 0.7rem; padding: 0.35rem 0.7rem; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .btn { display: block; padding: 0.85rem 1rem; border-radius: 12px; text-decoration: none; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); transition: transform 0.15s ease, background 0.15s ease; font-weight: 500; font-size: 1rem; }
    .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.12); }
    
    .btn.primary { background: var(--primary); color: #fff; font-weight: 700; border: none; margin-bottom: 0.6rem; }
    .btn.primary:hover { background: #2563eb; }
    
    .btn.formation { background: var(--accent); color: #fff; font-weight: 700; border: none; margin-bottom: 1.2rem; }
    .btn.formation:hover { background: #059669; }
    
    .links { display: grid; gap: 0.6rem; margin-bottom: 1.2rem; }
    footer small { color: var(--muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <main class="card">
    
    <!-- Remplace le lien par la photo de Darius -->
    <img src="assets/avatar_darius.jpg" alt="Photo de Darius" class="avatar" />
    
    <h1>Darius</h1>
    <div class="badge">🇹🇬 Togo</div>
    
    <p class="bio">Délégué médical. Je décrypte la santé et le numérique au Togo, et je forme pour agir.</p>
    
    <div class="tags">
      <span class="tag">Santé Numérique</span>
      <span class="tag">Délégué Médical</span>
      <span class="tag">Formations</span>
    </div>

    <!-- CTA Substack Togo (Lien à personnaliser par Darius) -->
    <a class="btn primary" href="https://lepoulsnumerique-togo.substack.com" target="_blank" rel="noopener">
      📖 Lire Le Pouls Numérique Togo
    </a>

    <!-- CTA Formations (Message WhatsApp pré-rempli pour Darius) -->
    <!-- Remplace le numéro par celui de Darius -->
    <a class="btn formation" href="https://wa.me/22890000000?text=Bonjour%20Darius,%20je%20souhaite%20avoir%20des%20informations%20sur%20vos%20formations%20!" target="_blank" rel="noopener">
      🎓 Se renseigner sur les formations
    </a>

    <div class="links">
      <a class="btn" href="https://tiktok.com/@lepoulsnumeriquetogo" target="_blank" rel="noopener">TikTok</a>
      
      <a class="btn" href="https://facebook.com/lepoulsnumeriquetogo" target="_blank" rel="noopener">Facebook</a>

      <a class="btn" href="https://wa.me/22890000000" target="_blank" rel="noopener">WhatsApp</a>
      
      <!-- Bouton Djoloba Togo -->
      <a class="btn" href="djoloba_togo.html" style="background-color: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981;" target="_blank" rel="noopener">
        📱 Découvrir Djoloba Togo
      </a>
    </div>

    <footer>
      <small>© 2026 · Le Pouls Numérique Togo</small>
    </footer>
  </main>
</body>
</html>
