<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nos Experts - Le Pouls Numérique</title>
  <style>
    /* Design très simple et pro */
    body { background-color: #f8fafc; font-family: system-ui, sans-serif; color: #1e293b; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { color: #0f172a; }
    
    .expert-grid { display: grid; gap: 1rem; }
    .expert-card {
      background: #ffffff; padding: 1.5rem; border-radius: 16px;
      border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .expert-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
    .expert-info h3 { margin: 0 0 0.2rem 0; font-size: 1.1rem; color: #0f172a; }
    .expert-info p { margin: 0; font-size: 0.85rem; color: #64748b; }
    .badge { display: inline-block; background: #dcfce7; color: #166534; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 10px; font-weight: bold; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Notre Comité d'Experts</h1>
      <p>Des professionnels de santé engagés pour une information vérifiée.</p>
    </div>

    <div class="expert-grid">
      <!-- Expert 1 -->
      <div class="expert-card">
        <img src="assets/avatar.jpg" alt="Mariane" class="expert-avatar">
        <div class="expert-info">
          <h3>Mariane</h3>
          <p>Fondatrice & Directrice Technique</p>
          <span class="badge">Tech & Management</span>
        </div>
      </div>

      <!-- Expert 2 -->
      <div class="expert-card">
        <!-- Remplace par la photo du médecin -->
        <div class="expert-avatar" style="background: #cbd5e1;"></div>
        <div class="expert-info">
          <h3>Dr. [Nom du Médecin]</h3>
          <p>Médecin Généraliste</p>
          <span class="badge">Rédacteur Santé</span>
        </div>
      </div>

      <!-- Expert 3 -->
      <div class="expert-card">
        <!-- Remplace par la photo du pharmacien -->
        <div class="expert-avatar" style="background: #cbd5e1;"></div>
        <div class="expert-info">
          <h3>[Nom du Pharmacien]</h3>
          <p>Pharmacien d'officine</p>
          <span class="badge">Expert Médicaments</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
